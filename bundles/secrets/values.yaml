# =============================================================================
# home-cloud-secrets values
# =============================================================================

domain: "mycloud.com"

tls:
  enabled: true
  certResolver: le

vault:
  enabled: true
  host: "vault"
  port: 8200
  # Installed from hashicorp chart:
  #   helm install vault hashicorp/vault \
  #     --namespace secrets --create-namespace \
  #     --set server.dev.enabled=true          # dev only, or
  #     --set server.ha.enabled=true           # HA + unseal
  mode: "dev"          # "dev" | "ha"
