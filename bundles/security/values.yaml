# =============================================================================
# home-cloud-security values
# =============================================================================

# NetworkPolicies are applied per namespace. Namespaces that exist in the
# cluster but are NOT listed here are left as-is (no policy).
# Add the namespaces you deployed via other bundles.
namespaces:
  - apps
  - storage
  - auth
  - secrets

# Default posture
defaultDenyIngress: true
defaultDenyEgress: true

# Allowed egress by default (set false to force explicit allow-list per app)
#   - DNS resolution via kube-dns/coredns in kube-system
#   - the Kubernetes API server (https)
allowBasic:
  dns: true
  kubeApi: true

# Extra named ports you want opened cluster-wide for testing (e.g. ICMP)
allowIcmp: false
