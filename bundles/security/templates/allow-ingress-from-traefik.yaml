{{- if .Values.allowTraefikIngress }}
{{- range .Values.namespaces }}
# Default-deny alone would 502 every route: the ingress controller (Traefik,
# installed in kube-system) must be allowed to reach backends. This allows
# ingress to this namespace from the Traefik pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-traefik
  namespace: {{ . }}
  labels:
    {{- include "hc-security.labels" $ | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
---
{{- end }}
{{- end }}
