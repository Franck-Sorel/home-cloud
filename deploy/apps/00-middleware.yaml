apiVersion: v1
kind: Namespace
metadata:
  name: apps
---
# Traefik v3: one type per Middleware (headers + rateLimit must be split).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: apps
spec:
  headers:
    customFrameOptionsValue: "SAMEORIGIN"
    contentTypeNosniff: true
    browserXssFilter: true
    referrerPolicy: "strict-origin-when-cross-origin"
    stsSeconds: 31536000
    stsIncludeSubdomains: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-limits
  namespace: apps
spec:
  rateLimit:
    average: 50
    burst: 20
