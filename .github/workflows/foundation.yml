name: foundation

# Proves the virtualization (LXD) + k3s foundation. The k3s/project/profile/
# launch/join/verify steps in this file are the SOURCE OF TRUTH and are verified
# manually on the datacenter host via:
#   plans/03-public-private-split/05-local-verification-runbook.md
#   plans/03-public-private-split/verify-local.sh
#
# CAVEAT: this workflow is verified LOCALLY, not reliably in CI. On a GitHub
# runner the LXD bridge has no egress (host firewall doesn't forward/NAT the
# bridge), so the very first `curl https://get.k3s.io` inside a container times
# out even though the same steps pass on the host. Treat CI as a best-effort
# smoke, not the green gate, until a NAT-ing runner is available.
#
# Trigger: manual (workflow_dispatch) or nightly. Heavy, so never on PR.

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "number of k3s workers to launch (CI-sized)"
        type: number
        default: 2
      server_mem:
        description: "k3s server memory (CI-sized)"
        default: "2GiB"
      worker_mem:
        description: "per-worker memory (CI-sized)"
        default: "1GiB"
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: foundation-ci
  cancel-in-progress: true

jobs:
  lxd-k3s:
    name: lxd-foundation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PROJECT: datacenter
      NET: datacenter-net
      POOL: datacenter-pool
      IMAGE: ubuntu:24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install LXD (default LTS snap) + init
        run: |
          set -euxo pipefail
          # 2026: default snap track is 5.21/stable; NOT latest/stable (rolling)
          sudo snap install lxd --channel=5.21/stable
          # Ubuntu 24.04 restricts unprivileged user namespaces by default; LXD
          # needs them ENABLED at the HOST level or it cannot create containers.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo lxd init --minimal
          sudo lxc version

      - name: "Create project, network, storage, profiles"
        run: |
          set -euxo pipefail
          Project() { sudo lxc "$@" --project "$PROJECT"; }
          Project project create "$PROJECT" 2>/dev/null || true
          sudo lxc network create "$NET" --type bridge --project "$PROJECT" ipv4.address=10.10.0.1/24 ipv4.nat=true ipv6.address=none 2>/dev/null || true
          # GitHub runners run Docker, which sets the kernel FORWARD policy to DROP
          # and only allows its own bridge (172.17.0.0/16). LXD container egress is
          # FORWARDED traffic, so it gets dropped → in-container curl times out.
          # Open the LXD bridge explicitly. NEVER restart Docker (it rewrites these
          # rules on start); we only insert our own rules on top.
          sudo iptables -I FORWARD -i "$NET" -j ACCEPT
          sudo iptables -I FORWARD -o "$NET" -j ACCEPT
          sudo lxc storage create "$POOL" dir --project "$PROJECT" 2>/dev/null || true
          # New project's default profile is EMPTY -> copy the main profile in.
          sudo lxc profile show default --project default | sudo lxc profile edit default
          sudo lxc profile create dc-base --project "$PROJECT" 2>/dev/null || true
          sudo lxc profile set dc-base --project "$PROJECT" "limits.cpu=1"
          sudo lxc profile set dc-base --project "$PROJECT" "limits.memory=${{ inputs.worker_mem || '1GiB' }}"
          sudo lxc profile set dc-base --project "$PROJECT" "security.nesting=true"
          # k3s needs to load kernel modules (br_netfilter, overlay) via modprobe
          # in ExecStartPre; an unprivileged container can't (no CAP_SYS_MODULE),
          # so the server crash-loops. Privileged is required for k3s-in-LXD
          # (article Part 2 "the privileged profile"). Lab-only, not a security
          # boundary.
          sudo lxc profile set dc-base --project "$PROJECT" "security.privileged=true"
          # kubelet needs /dev/kmsg (kernel message device), absent in an
          # unprivileged LXD container → kubelet crashes → server crash-loops.
          # Pass the host's /dev/kmsg through (article Part 2 device passthrough).
          sudo lxc profile device add dc-base kmsg unix-char source=/dev/kmsg path=/dev/kmsg 2>/dev/null || true
          # (host-level sysctl already enables userns; no in-container sysctl needed)
          sudo lxc profile set dc-base --project "$PROJECT" "linux.kernel_modules=ip_tables,ip6_tables,overlay"
          # NOTE: linux.sysctl.* at profile level fails ("Failed to set LXC config")
          # for both apparmor_restrict_unprivileged_userns and ipv6.disable_ipv6.
          # IPv6 is disabled INSIDE each container at runtime instead (see install
          # and join steps) because the LXD bridge DNS returns AAAA-only records
          # and containers have no IPv6 routing → curl hangs on IPv6 connections.

      - name: "Launch k3s server + workers (LXD system containers)"
        run: |
          set -euxo pipefail
          W=${{ inputs.workers || 2 }}
          sudo lxc launch "$IMAGE" k3s-server --project "$PROJECT" --profile dc-base \
            --config "limits.cpu=2" --config "limits.memory=${{ inputs.server_mem || '2GiB' }}" \
            --device "root,size=20GiB" --storage "$POOL" --network "$NET"
          i=1
          while [ "$i" -le "$W" ]; do
            sudo lxc launch "$IMAGE" "k3s-worker$i" --project "$PROJECT" --profile dc-base \
              --config "limits.cpu=1" --config "limits.memory=${{ inputs.worker_mem || '1GiB' }}" \
              --device "root,size=15GiB" --storage "$POOL" --network "$NET"
            i=$((i+1))
          done
          sudo lxc list --project "$PROJECT"

      - name: "Test container connectivity (DNS + outbound HTTPS)"
        run: |
          set -euxo pipefail
          echo "=== HOST: default route ==="
          ip route
          echo "=== HOST: iptables NAT rules for 10.10.0.0/24 ==="
          sudo iptables -t nat -L -n | grep -E '10\.10\.0|MASQUERADE' || echo "NO NAT RULES"
          echo "=== HOST: FORWARD policy ==="
          sudo iptables -L FORWARD -n | head -10
          sudo lxc exec --project "$PROJECT" k3s-server -- bash -c '
            echo "=== CONTAINER: IPv6 status ==="
            sysctl net.ipv6.conf.all.disable_ipv6 || true
            echo "=== CONTAINER: default route ==="
            ip route
            echo "=== CONTAINER: ping 8.8.8.8 (ICMP via NAT) ==="
            ping -4 -c 2 -W 3 8.8.8.8 || echo "PING FAIL"
            echo "=== CONTAINER: reach host bridge gw 10.10.0.1:53 ==="
            timeout 3 bash -c "echo > /dev/tcp/10.10.0.1/53" && echo "host:53 reachable" || echo "host:53 FAIL"
            echo "=== CONTAINER: curl http://example.com (port 80) ==="
            curl -4 -v --max-time 10 http://example.com -o /dev/null 2>&1 | tail -4 || echo "HTTP FAIL"
            echo "=== CONTAINER: curl https://1.1.1.1 (IP, no DNS) ==="
            curl -4 -v --max-time 10 https://1.1.1.1 -o /dev/null 2>&1 | tail -4 || echo "HTTPS-IP FAIL"
            echo "=== CONTAINER: curl get.k3s.io (IPv4, max 60s) ==="
            curl -4 -sfL --max-time 60 -o /tmp/k3s-install.sh https://get.k3s.io && wc -c /tmp/k3s-install.sh || echo "CURL FAIL rc=$?"
          '

      - name: Install k3s server
        run: |
          set -euxo pipefail

          # -c 4 returns "IP (iface)" e.g. "10.10.0.159 (eth0)" — strip the iface
          SERVER_IP=$(sudo lxc list --project "$PROJECT" --format csv -c 4,n | awk -F, '/k3s-server/{print $1; exit}' | sed 's/ .*//')
          echo "SERVER_IP=$SERVER_IP" >> "$GITHUB_ENV"
          echo "server ip: $SERVER_IP"

          sudo lxc exec --project "$PROJECT" k3s-server -- bash -c "
            set -euxo pipefail
            # belt-and-suspenders: disable IPv6 inside the container too (profile
            # sysctl may not apply if LXD version lacks support)
            sysctl -w net.ipv6.conf.all.disable_ipv6=1 || true
            # download the installer separately so a silent/empty download is visible
            curl -4 -sfL --max-time 120 -o /tmp/k3s-install.sh https://get.k3s.io
            echo 'install script bytes:'; wc -c /tmp/k3s-install.sh
            INSTALL_K3S_EXEC='server --disable=traefik --node-ip=$SERVER_IP --tls-san=$SERVER_IP --tls-san=localhost --flannel-iface=eth0' \
            K3S_KUBECONFIG_MODE=644 sh /tmp/k3s-install.sh
          "

          # Fail loudly if the server never becomes Ready — otherwise the step
          # "succeeds" while the server is unreachable and the agent join hangs
          # forever (k3s service is Type=notify with TimeoutStartSec=0).
          # First startup can take ~6 min (image pulls + etcd init), so poll 10 min.
          READY=0
          for i in $(seq 1 120); do
            if sudo lxc exec --project "$PROJECT" k3s-server -- bash -c 'export KUBECONFIG=/etc/rancher/k3s/k3s.yaml; kubectl get node k3s-server 2>/dev/null | grep -q Ready'; then
              echo "server Ready"
              READY=1
              break
            fi
            echo "waiting server... ($i)"
            sleep 5
          done
          [ "$READY" = "1" ] || { echo "::error::k3s server never became Ready — see Diagnose step"; exit 1; }

          sudo lxc exec --project "$PROJECT" k3s-server -- bash -c 'cat /var/lib/rancher/k3s/server/node-token' | tr -d '\n' > /tmp/token
          echo "::add-mask::$(cat /tmp/token)"
          echo "K3S_TOKEN=$(cat /tmp/token)" >> "$GITHUB_ENV"

      - name: "Diagnose k3s server (runs even if the install step failed)"
        if: always()
        run: |
          set -x
          if sudo lxc exec --project "$PROJECT" k3s-server -- bash -c 'export KUBECONFIG=/etc/rancher/k3s/k3s.yaml; kubectl get node k3s-server 2>/dev/null | grep -q Ready' 2>/dev/null; then
            echo "k3s server is Ready — no diagnostics needed"
            exit 0
          fi
          echo "=== k3s service status ==="
          sudo lxc exec --project "$PROJECT" k3s-server -- systemctl status k3s --no-pager -l || true
          echo "=== k3s journal (last 150 lines) ==="
          sudo lxc exec --project "$PROJECT" k3s-server -- journalctl -u k3s --no-pager -n 150 || true
          echo "=== k3s dir + install log ==="
          sudo lxc exec --project "$PROJECT" k3s-server -- bash -c 'ls -la /var/lib/rancher/k3s/ 2>/dev/null; tail -100 /var/lib/rancher/k3s/k3s.log 2>/dev/null' || true
          echo "=== /etc/rancher/k3s (kubeconfig + server credentials) ==="
          sudo lxc exec --project "$PROJECT" k3s-server -- bash -c 'ls -la /etc/rancher/k3s/ 2>/dev/null; head -25 /etc/rancher/k3s/k3s.yaml 2>/dev/null' || true
          echo "=== container info ==="
          sudo lxc info k3s-server --project "$PROJECT" || true

      - name: Join workers (parallel)
        run: |
          set -euxo pipefail
          W=${{ inputs.workers || 2 }}
          # Workers are independent → join them in parallel (bash background jobs;
          # LXD state must persist in this single job, so no cross-job matrix).
          # Each join is wrapped in `timeout` because k3s's systemctl start blocks
          # forever (Type=notify, TimeoutStartSec=0) if the agent can't reach the
          # server — a timeout turns a silent hang into a loud failure.
          pids=()
          for i in $(seq 1 "$W"); do
            (
              set -euo pipefail
              WIP=$(sudo lxc list --project "$PROJECT" --format csv -c 4,n | awk -F, "/k3s-worker$i/{print \$1; exit}" | sed 's/ .*//')
              echo "joining k3s-worker$i at $WIP"
              timeout 300 sudo lxc exec "k3s-worker$i" --project "$PROJECT" -- bash -c "
                sysctl -w net.ipv6.conf.all.disable_ipv6=1 || true
                curl -4 -sfL https://get.k3s.io | \
                  K3S_URL='https://${SERVER_IP}:6443' K3S_TOKEN='${K3S_TOKEN}' K3S_NODE_NAME='k3s-worker$i' \
                  INSTALL_K3S_EXEC='--node-ip=$WIP --flannel-iface=eth0' sh -s -
              "
            ) &
            pids+=("$!")
          done
          FAIL=0
          for p in "${pids[@]}"; do wait "$p" || FAIL=1; done
          [ "$FAIL" = "0" ] || { echo "::error::one or more workers failed to join"; exit 1; }

      - name: Verify cluster (all nodes Ready)
        run: |
          set -euxo pipefail
          W=${{ inputs.workers || 2 }}
          sudo lxc file pull k3s-server/etc/rancher/k3s/k3s.yaml --project "$PROJECT" k3s.yaml
          sed -i "s/127.0.0.1/${SERVER_IP}/" k3s.yaml
          export KUBECONFIG=$PWD/k3s.yaml
          kubectl cluster-info
          for i in $(seq 1 60); do
            N=$(kubectl get nodes --no-headers 2>/dev/null | grep -c Ready || true)
            echo "ready=$N/$((1+W)) (iter $i)"; [ "$N" -ge "$((1+W))" ] && break; sleep 5
          done
          kubectl get nodes -o wide
          kubectl get pods -A -o wide
          [ "$(kubectl get nodes --no-headers | grep -c Ready)" -ge "$((1+W))" ]

      - name: "Toggle + snapshot sanity"
        run: |
          set -euxo pipefail
          sudo lxc snapshot k3s-server snap-ci --project "$PROJECT"
          sudo lxc restore k3s-server snap-ci --project "$PROJECT"
          sudo lxc stop --all --project "$PROJECT"
          sudo lxc start k3s-server --project "$PROJECT"
          sleep 15
          export KUBECONFIG=$PWD/k3s.yaml
          kubectl get nodes -o wide || true
          echo "FOUNDATION GREEN ✅"
