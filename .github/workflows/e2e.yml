name: e2e

# End-to-end validation: boots a REAL k3s cluster in CI (bare get.k3s.io
# install, per docs/02-setup/01-install-k3s) with our own Traefik v3, then
# installs the Helm bundles in dependency order and checks they interoperate.
#
# This is deliberately different from `ci.yml` / `just validate` (static
# accuracy: helm lint+render, shellcheck, yamllint). This workflow actually
# installs the charts into a live cluster and checks the running behaviour.
#
# Heavy + slow by nature, so it runs ONLY on manual dispatch or a nightly
# cron — never on pull_request. A concurrency group prevents overlapping runs.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # nightly (UTC)

concurrency:
  group: e2e-tests
  cancel-in-progress: true

jobs:
  e2e:
    name: boot-bundles-and-assert
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # NOTE: `runner` context is NOT allowed in job-level env, so the
      # kubeconfig path is not set here — we point the default ~/.kube/config
      # at k3s right after install (see "Point the default kubeconfig" step).
      DOMAIN: mycloud.com
      # `cloudflare` mode renders the base hello IngressRoute as web-only and
      # skips the mode=ddns DDNS CronJob (whose ddns-credentials Secret cannot
      # exist in CI—it would spawn error pods). No real tunnel is created:
      # base's cloudflared template dir is empty, so this is a plain ingress test.
      MODE: cloudflare
    steps:
      - uses: actions/checkout@v7

      # --- Same tooling as ci.yml: just + helm, plus kubectl for assertions ---
      - name: Install Just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: "v3.15.4"

      - name: Install kubectl
        uses: azure/setup-kubectl@v5

      # --- Boot a real k3s cluster using the documented get.k3s.io install ---
      - name: Install k3s (bare)
        run: |
          # k3s, installed via the official script (the docs' own path).
          # We DISABLE the bundled Traefik so it cannot conflict with the
          # Traefik v3 chart we install ourselves as our ingress controller.
          curl -sfL https://get.k3s.io \
            | sudo INSTALL_K3S_VERSION="v1.36.3+k3s1" \
              K3S_KUBECONFIG_MODE="644" \
              sh -s - --disable traefik
          sudo systemctl is-active k3s

      - name: Point the default kubeconfig at k3s
        run: |
          mkdir -p ~/.kube
          sudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/config
          sudo chown "$(id -u):$(id -g)" ~/.kube/config
          chmod 600 ~/.kube/config
          # wait until the k3s node registers, then until it is Ready
          for i in $(seq 1 60); do
            if kubectl get node --no-headers 2>/dev/null | grep -q .; then break; fi
            echo "waiting for k3s node to register... ($i)"; sleep 5
          done
          kubectl get nodes -o wide
          kubectl wait --for=condition=Ready node --all --timeout=240s

      - name: Install Traefik v3 (our ingress controller)
        run: |
          set -euo pipefail
          # k3s was started with --disable traefik, so we install OUR Traefik v3
          # chart (matches the traefik.io/v1alpha1 CRDs our manifests use). The
          # chart installs its own CRDs, and k3s's servicelb backs its
          # LoadBalancer service on the node IP.
          helm repo add traefik https://traefik.github.io/charts
          helm install traefik traefik/traefik -n kube-system --create-namespace
          kubectl -n kube-system rollout status deployment/traefik --timeout=240s
          kubectl -n kube-system get pods -o wide
          kubectl get svc -n kube-system traefik

      # No real public DNS in CI: point our hostnames at the k3s node's
      # InternalIP, where k3s servicelb exposes the Traefik LoadBalancer.
      - name: Map bundle hostnames to the cluster node IP
        run: |
          NODEIP=$(kubectl get node -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}' | tr ' ' '\n' | head -1)
          echo "node IP: $NODEIP"
          sudo bash -c "echo '$NODEIP hello.mycloud.com' >> /etc/hosts"
          grep hello.mycloud.com /etc/hosts

      # ======================================================================
      # PHASE 1 — step-by-step install in dependency order via apply.sh
      # base first (everything else builds on its app/middleware namespaces),
      # then the opt-in bundles, security last on top of all existing namespaces.
      # ======================================================================
      - name: Deploy base first (repo tooling)
        run: |
          # MODE=cloudflare + connectors off: renders the base glue only
          # (namespace, middleware, hello, ingress route). We explicitly turn
          # OFF the cloudflared edge Deployment because its credentials Secret
          # cannot exist in CI (no real tunnel); see plans/01-e2e-validation.
          DOMAIN="$DOMAIN" MODE="$MODE" CONNECTORS=false ./scripts/apply.sh base

      - name: Deploy opt-in bundles (auth storage secrets serverless registry observability)
        run: |
          DOMAIN="$DOMAIN" MODE="$MODE" ./scripts/apply.sh auth storage secrets serverless registry observability

      - name: Deploy security bundle last (default-deny NetworkPolicies)
        run: |
          DOMAIN="$DOMAIN" MODE="$MODE" ./scripts/apply.sh security

      - name: Wait for hello to be serving + all pods Running
        run: |
          kubectl -n apps rollout status deployment/hello --timeout=240s
          sleep 15
          kubectl get pods -A

      - name: Healthcheck (adapted for CI — no public DNS / tunnel)
        run: |
          set -euo pipefail
          kubectl cluster-info >/dev/null 2>&1
          node=$(kubectl get nodes --no-headers | awk '{print $2}' | head -1)
          [[ "$node" == "Ready" ]] || { echo "✘ L0 node not Ready ($node)"; exit 1; }
          notrun=$(kubectl get pods -n kube-system --no-headers 2>/dev/null | grep -cvE 'Running|Completed' || true)
          [[ "$notrun" -eq 0 ]] || { echo "✘ L1 non-Running(,non-Completed) kube-system pods: $notrun"; exit 1; }
          routes=$(kubectl get ingressroute -A --no-headers 2>/dev/null | wc -l)
          [[ "$routes" -ge 1 ]] || { echo "✘ L4 no IngressRoutes"; exit 1; }
          down=$(kubectl get pods -A --no-headers 2>/dev/null | grep -cv 'Running\|Completed' || true)
          [[ "$down" -eq 0 ]] || { echo "✘ L5 non-Running pods cluster-wide: $down"; exit 1; }
          echo "✔ healthcheck OK — L0 node / L1 kube-system / L4 routes / L5 pods"
          echo "  (L2 cloudflared tunnel + L3 public TLS skipped: no DNS/LE in CI, see plans/01-e2e-validation/03-what-doesnt.md)"

      - name: Smoke (adapted for CI — cluster-local Traefik)
        run: |
          set -euo pipefail
          running=$(kubectl get pods -A --no-headers 2>/dev/null | grep -c Running || true)
          [[ "$running" -ge 3 ]] || { echo "✘ too few Running pods ($running)"; exit 1; }
          code=$(curl --noproxy '*' -s -o /dev/null -w '%{http_code}' --max-time 15 http://hello.mycloud.com/ || true)
          if [[ "$code" != "200" ]]; then
            echo "✘ hello HTTP $code (expected 200)"
            echo "--- diagnostics ---"
            echo "### hello IngressRoute"
            kubectl -n apps get ingressroute hello -o yaml || true
            echo "### all IngressRoutes"
            kubectl get ingressroute -A || true
            echo "### traefik pod logs (last 40)"
            kubectl -n kube-system logs deploy/traefik --tail=40 || true
            echo "### traefik svc + endpoints"
            kubectl -n kube-system get svc traefik -o wide || true
            kubectl -n kube-system get endpoints traefik || true
            echo "### hello svc + endpoints + pods"
            kubectl -n apps get svc hello -o wide || true
            kubectl -n apps get endpoints hello || true
            kubectl -n apps get pods -o wide || true
            exit 1
          fi
          echo "✔ smoke OK — $running Running pods, hello HTTP $code via cluster-local Traefik"
          echo "  (API_URL health probe skipped: no api backend is deployed by these bundles)"

      - name: Write Phase 1 cross-stack assertions
        run: |
          cat > "$RUNNER_TEMP/e2e-phase1.sh" <<'PH1EOF'
          #!/usr/bin/env bash
          set -uo pipefail
          R="${RUNNER_TEMP:-.}"
          RESULTS="$R/e2e-phase1.txt"; : > "$RESULTS"
          BODY=""
          PASS=0; TOTAL=0; FAILURES=0
          e(){ echo "$1" >> "$RESULTS"; echo "$1"; }
          run_check(){
            local name="$1"; shift; TOTAL=$((TOTAL+1))
            if ( "$@" ) >"$R/chk.out" 2>&1; then
              PASS=$((PASS+1)); e "✔ $name"
              BODY+="    <testcase classname=\"phase1\" name=\"$name\"/>\n"
            else
              FAILURES=$((FAILURES+1)); e "✘ $name"
              BODY+="    <testcase classname=\"phase1\" name=\"$name\"><failure/></testcase>\n"
              sed 's/^/    | /' "$R/chk.out" >&2
            fi
          }
          # (a) hello Deployment Serving + reachable through Traefik IngressRoute
          assert_hello_deploy(){
            kubectl -n apps get deployment hello >/dev/null 2>&1 || { echo "hello Deployment missing"; return 1; }
            local reps
            reps=$(kubectl -n apps get deployment hello -o jsonpath='{.status.availableReplicas}' 2>/dev/null || true)
            [[ -n "$reps" && "$reps" -ge 1 ]] || { echo "no available replicas (got '$reps')"; return 1; }
            echo "hello available replicas: $reps"
          }
          assert_hello_traefik(){
            local code
            code=$(curl --noproxy '*' -s -o "$R/hello-body.html" -w '%{http_code}' --max-time 20 http://hello.mycloud.com/ || true)
            [[ "$code" == "200" ]] || { echo "hello HTTP $code (expected 200)"; return 1; }
            grep -q "Welcome to home-cloud" "$R/hello-body.html" || { echo "hello body missing expected text"; return 1; }
            echo "hello HTTP 200 through Traefik IngressRoute (cluster-local)"
          }
          # (b) security-headers + security-limits Middlewares attached
          assert_middleware_attached(){
            kubectl -n apps get middleware security-headers >/dev/null 2>&1 || { echo "middleware security-headers missing"; return 1; }
            kubectl -n apps get middleware security-limits  >/dev/null 2>&1 || { echo "middleware security-limits missing"; return 1; }
            local refs
            refs=$(kubectl -n apps get ingressroute hello -o jsonpath='{.spec.routes[0].middlewares[*].name}' 2>/dev/null || true)
            echo "$refs" | grep -qw security-headers || { echo "hello route not attached to security-headers (got: $refs)"; return 1; }
            echo "$refs" | grep -qw security-limits  || { echo "hello route not attached to security-limits (got: $refs)"; return 1; }
            echo "security-headers + security-limits present and attached on hello route"
          }
          assert_security_headers(){
            local hdrs
            hdrs=$(curl --noproxy '*' -sI --max-time 20 http://hello.mycloud.com/ || true)
            grep -qi 'X-Content-Type-Options: *nosniff' <<<"$hdrs" \
              || { echo "missing header X-Content-Type-Options: nosniff"; return 1; }
            grep -qi 'X-Frame-Options: *SAMEORIGIN' <<<"$hdrs" \
              || { echo "missing header X-Frame-Options: SAMEORIGIN"; return 1; }
            echo "SecurityHeaders applied by middleware"
          }
          # (c) auth protected-gate middleware present
          assert_protected_gate(){
            kubectl -n apps get middleware protected-gate >/dev/null 2>&1 || { echo "protected-gate missing (auth bundle not applied?)"; return 1; }
            local addr
            addr=$(kubectl -n apps get middleware protected-gate -o jsonpath='{.spec.forwardAuth.address}' 2>/dev/null || true)
            echo "$addr" | grep -q 'oauth2-proxy\.auth\.svc\.cluster\.local' || { echo "protected-gate forwardAuth unexpected: $addr"; return 1; }
            echo "protected-gate (auth) present; forwardAuth -> $addr"
          }
          # (d) namespaces for all enabled bundles exist
          assert_namespaces(){
            for ns in apps auth storage secrets serverless registry monitoring; do
              kubectl get namespace "$ns" >/dev/null 2>&1 || { echo "expected namespace missing: $ns"; return 1; }
            done
            echo "namespaces present: apps auth storage secrets serverless registry monitoring"
          }
          # (e) NetworkPolicies from security bundle present
          assert_network_policies(){
            local rc=0
            for ns in apps auth storage secrets; do
              kubectl -n "$ns" get networkpolicy default-deny-ingress >/dev/null 2>&1 || { echo "missing default-deny-ingress in $ns"; rc=1; }
              kubectl -n "$ns" get networkpolicy default-deny-egress  >/dev/null 2>&1 || { echo "missing default-deny-egress in $ns"; rc=1; }
            done
            [[ $rc -eq 0 ]] || return 1
            echo "default-deny NetworkPolicies present (ingress+egress) in apps/auth/storage/secrets"
          }
          run_check "A1 hello Deployment serving"            assert_hello_deploy
          run_check "A2 hello reachable via Traefik IngressRoute" assert_hello_traefik
          run_check "B1 security-headers+limits middleware attached"  assert_middleware_attached
          run_check "B2 SecurityHeaders applied"                 assert_security_headers
          run_check "C1 auth protected-gate middleware present"  assert_protected_gate
          run_check "D1 enabled-bundle namespaces exist"         assert_namespaces
          run_check "E1 security NetworkPolicies present"        assert_network_policies
          e ""
          e "PHASE 1 cross-stack: $PASS/$TOTAL passed, $FAILURES failed"
          {
            printf '<?xml version="1.0" encoding="UTF-8"?>\n'
            printf '<testsuites name="home-cloud-e2e-phase1" tests="%d" failures="%d">\n' "$TOTAL" "$FAILURES"
            printf '  <testsuite name="cross-stack" tests="%d" failures="%d">\n' "$TOTAL" "$FAILURES"
            printf '%b' "$BODY"
            printf '  </testsuite>\n</testsuites>\n'
          } > "$R/JUnit-phase1.xml"
          if [[ "$FAILURES" -gt 0 ]]; then echo "✘ E2E PHASE 1 FAILED" >&2; exit 1; else echo "✔ E2E PHASE 1 GREEN"; fi
          PH1EOF
          chmod +x "$RUNNER_TEMP/e2e-phase1.sh"

      - name: Run Phase 1 cross-stack assertions
        run: |
          bash "$RUNNER_TEMP/e2e-phase1.sh"
          { echo "## Phase 1 — cross-stack assertions"; echo; echo '```'; cat "$RUNNER_TEMP/e2e-phase1.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # ======================================================================
      # Teardown Phase 1 so the aggregator can be verified on a clean cluster.
      # ======================================================================
      - name: Teardown Phase 1 bundles + namespaces
        run: |
          for r in home-cloud-base home-cloud-auth home-cloud-storage \
                   home-cloud-secrets home-cloud-serverless home-cloud-registry \
                   home-cloud-observability home-cloud-security; do
            helm uninstall "$r" >/dev/null 2>&1 || true
          done
          for ns in apps auth storage secrets serverless registry monitoring; do
            kubectl delete namespace "$ns" --ignore-not-found=true --wait=true >/dev/null 2>&1 || true
          done
          kubectl get namespaces

      # ======================================================================
      # PHASE 3 — the home-cloud aggregator chart: enable a chosen set via
      # values, prove enabled bundles are present and a disabled one is absent.
      # ======================================================================
      - name: Install aggregator (home-cloud chart) with a controlled bundle set
        run: |
          # enabled: base, auth, storage, registry, security  (tls disabled: no DNS/LE in CI)
          # disabled: secrets, serverless, observability
          helm upgrade --install home-cloud bundles/home-cloud \
            --set base.enabled=true --set base.domain=mycloud.com --set base.mode=cloudflare --set base.tls.enabled=false --set base.connectors.enabled=false \
            --set auth.enabled=true --set auth.domain=mycloud.com --set auth.tls.enabled=false \
            --set storage.enabled=true --set storage.domain=mycloud.com --set storage.tls.enabled=false \
            --set registry.enabled=true --set registry.domain=mycloud.com --set registry.tls.enabled=false \
            --set security.enabled=true --set security.namespaces="{apps,auth,storage,registry}" \
            --set secrets.enabled=false --set serverless.enabled=false --set observability.enabled=false

      - name: Wait for aggregator hello rollout + pods
        run: |
          kubectl -n apps rollout status deployment/hello --timeout=240s
          sleep 10
          kubectl get pods -A

      - name: Write Aggregator (Phase 3) assertions
        run: |
          cat > "$RUNNER_TEMP/e2e-phase3.sh" <<'PH3EOF'
          #!/usr/bin/env bash
          set -uo pipefail
          R="${RUNNER_TEMP:-.}"
          RESULTS="$R/e2e-phase3.txt"; : > "$RESULTS"
          BODY=""
          PASS=0; TOTAL=0; FAILURES=0
          e(){ echo "$1" >> "$RESULTS"; echo "$1"; }
          run_check(){
            local name="$1"; shift; TOTAL=$((TOTAL+1))
            if ( "$@" ) >"$R/chk.out" 2>&1; then
              PASS=$((PASS+1)); e "✔ $name"
              BODY+="    <testcase classname=\"phase3\" name=\"$name\"/>\n"
            else
              FAILURES=$((FAILURES+1)); e "✘ $name"
              BODY+="    <testcase classname=\"phase3\" name=\"$name\"><failure/></testcase>\n"
              sed 's/^/    | /' "$R/chk.out" >&2
            fi
          }
          # (f) aggregator enables exactly the requested bundles
          assert_enabled_present(){
            # base re-applied via aggregator: hello must serve again
            kubectl -n apps get deployment hello >/dev/null 2>&1 || { echo "hello missing (base not enabled)"; return 1; }
            local code
            code=$(curl --noproxy '*' -s -o /dev/null -w '%{http_code}' --max-time 20 http://hello.mycloud.com/ || true)
            [[ "$code" == "200" ]] || { echo "hello HTTP $code via aggregator"; return 1; }
            # enabled namespaces
            for ns in apps auth storage registry; do
              kubectl get namespace "$ns" >/dev/null 2>&1 || { echo "enabled ns missing: $ns"; return 1; }
            done
            # auth middleware present when auth enabled
            kubectl -n apps get middleware protected-gate >/dev/null 2>&1 || { echo "auth protected-gate missing"; return 1; }
            # storage + registry routes present when enabled
            kubectl -n storage get ingressroute minio-api >/dev/null 2>&1 || { echo "storage minio-api route missing"; return 1; }
            kubectl -n registry get ingressroute harbor  >/dev/null 2>&1 || { echo "registry harbor route missing"; return 1; }
            # security netpols only on the enabled namespaces we configured
            for ns in apps auth storage registry; do
              kubectl -n "$ns" get networkpolicy default-deny-ingress >/dev/null 2>&1 || { echo "netpol missing in $ns"; return 1; }
            done
            echo "enabled set present: base+auth+storage+registry+security"
          }
          assert_disabled_absent(){
            local rc=0
            for ns in secrets serverless monitoring; do
              kubectl get namespace "$ns" >/dev/null 2>&1 && { echo "disabled bundle namespace EXISTS: $ns"; rc=1; }
            done
            kubectl get ingressroute -A --no-headers 2>/dev/null | grep -qw vault && { echo "vault route exists despite secrets disabled"; rc=1; }
            kubectl get ingressroute -A --no-headers 2>/dev/null | grep -qw faas-gateway && { echo "faas route exists despite serverless disabled"; rc=1; }
            [[ $rc -eq 0 ]] || return 1
            echo "disabled bundles absent: secrets, serverless, observability"
          }
          run_check "F1 aggregator enables exactly the requested set" assert_enabled_present
          run_check "F2 a disabled bundle is absent"                 assert_disabled_absent
          e ""
          e "PHASE 3 aggregator: $PASS/$TOTAL passed, $FAILURES failed"
          {
            printf '<?xml version="1.0" encoding="UTF-8"?>\n'
            printf '<testsuites name="home-cloud-e2e-phase3" tests="%d" failures="%d">\n' "$TOTAL" "$FAILURES"
            printf '  <testsuite name="aggregator" tests="%d" failures="%d">\n' "$TOTAL" "$FAILURES"
            printf '%b' "$BODY"
            printf '  </testsuite>\n</testsuites>\n'
          } > "$R/JUnit-phase3.xml"
          if [[ "$FAILURES" -gt 0 ]]; then echo "✘ E2E PHASE 3 FAILED" >&2; exit 1; else echo "✔ E2E PHASE 3 GREEN"; fi
          PH3EOF
          chmod +x "$RUNNER_TEMP/e2e-phase3.sh"

      - name: Run Aggregator (Phase 3) assertions
        run: |
          bash "$RUNNER_TEMP/e2e-phase3.sh"
          { echo; echo "## Phase 3 — aggregator assertions (f)"; echo; echo '```'; cat "$RUNNER_TEMP/e2e-phase3.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # ======================================================================
      # Report — archive JUnit-style results so the repo history shows "green".
      # ======================================================================
      - name: Archive E2E results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-junit
          path: |
            ${{ runner.temp }}/JUnit-phase1.xml
            ${{ runner.temp }}/JUnit-phase3.xml
            ${{ runner.temp }}/e2e-phase1.txt
            ${{ runner.temp }}/e2e-phase3.txt
          if-no-files-found: warn

      - name: E2E summary
        if: always()
        run: |
          { echo "## ☁️ home-cloud E2E result"; echo; \
            echo "Phases: **Phase 1** (step-by-step bundle boot + cross-stack A–E) and **Phase 3** (aggregator enabled/disabled, check F)."; \
            echo; echo "See the e2e-junit artifact and the logs above for granular assertions."; } >> "$GITHUB_STEP_SUMMARY"
